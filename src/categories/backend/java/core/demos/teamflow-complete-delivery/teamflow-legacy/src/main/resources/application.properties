spring.application.name=teamflow-legacy
springdoc.api-docs.version=OPENAPI_3_0
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB
spring.datasource.url=${TEAMFLOW_DB_URL:jdbc:mysql://127.0.0.1:3306/teamflow}
spring.datasource.username=${TEAMFLOW_DB_USER:teamflow}
spring.datasource.password=${TEAMFLOW_DB_PASSWORD:local-teamflow-pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.initialization-mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
mybatis.mapper-locations=classpath:mappers/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

spring.redis.host=${TEAMFLOW_REDIS_HOST:127.0.0.1}
spring.redis.password=${TEAMFLOW_REDIS_PASSWORD:local-redis-pass}
spring.redis.timeout=2s
teamflow.verification.code-prefix=${TEAMFLOW_VERIFICATION_CODE_PREFIX:teamflow:verification-code:v1:email-change}
teamflow.verification.attempt-prefix=${TEAMFLOW_VERIFICATION_ATTEMPT_PREFIX:teamflow:verification-attempts:v1:email-change}

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:127.0.0.1}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:teamflow}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:local-rabbit-pass}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.listener.simple.default-requeue-rejected=false

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,redis,rabbit
management.endpoint.health.show-details=never
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level correlationId=%X{correlationId} logger=%logger{36} - %msg%n

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=15s
teamflow.jwt-secret=${TEAMFLOW_JWT_SECRET}
teamflow.relay.delay-ms=500
teamflow.partner.base-url=${TEAMFLOW_PARTNER_BASE_URL:http://127.0.0.1:18090}
