<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="embedded-status-host"
      content="host-owned"
      data-embedded-status-resource="metadata"
    />
    <title>嵌入式状态面板宿主页</title>
    <style data-embedded-status-resource="theme">
      :root {
        color: #162032;
        background: #eef2f5;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 0;
        margin: 0;
        padding: 20px;
      }

      button {
        font: inherit;
      }

      .host-shell {
        width: min(100%, 720px);
        margin: 0 auto;
      }

      .host-shell__label {
        margin: 0 0 10px;
        color: #526174;
        font-size: 13px;
        font-weight: 700;
      }

      .embedded-status-panel {
        min-width: 0;
        overflow: hidden;
        background: #ffffff;
        border: 1px solid #cbd5df;
        border-radius: 8px;
        box-shadow: 0 10px 28px rgba(31, 42, 55, 0.1);
      }

      .embedded-status-panel__heading {
        padding: 18px 20px;
        color: #ffffff;
        background: #24364a;
      }

      .embedded-status-panel__heading span,
      .embedded-status-panel__heading strong {
        display: block;
        overflow-wrap: anywhere;
      }

      .embedded-status-panel__heading span {
        color: #b9d5e6;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .embedded-status-panel__heading strong {
        margin-top: 6px;
        font-size: 22px;
        line-height: 1.35;
      }

      .embedded-status-panel__body {
        display: flex;
        align-items: stretch;
        min-width: 0;
        padding: 18px 20px;
      }

      .embedded-status-panel__summary {
        flex: 1 1 300px;
        min-width: 0;
        margin-right: 16px;
        padding: 16px;
        border-left: 4px solid #16825d;
        background: #edf8f3;
      }

      .embedded-status-panel[data-status='attention'] .embedded-status-panel__summary {
        border-left-color: #9a6500;
        background: #fff7df;
      }

      .embedded-status-panel[data-status='critical'] .embedded-status-panel__summary {
        border-left-color: #b13a3a;
        background: #fff0f0;
      }

      .embedded-status-panel__summary span,
      .embedded-status-panel__summary strong,
      .embedded-status-panel__summary p {
        display: block;
        margin: 0;
        overflow-wrap: anywhere;
      }

      .embedded-status-panel__summary span {
        color: #526174;
        font-size: 12px;
        font-weight: 700;
      }

      .embedded-status-panel__summary strong {
        margin-top: 6px;
        font-size: 22px;
      }

      .embedded-status-panel__summary p {
        margin-top: 8px;
        color: #465467;
        line-height: 1.55;
      }

      .embedded-status-panel__facts {
        display: flex;
        flex: 0 1 250px;
        min-width: 0;
        margin: 0;
      }

      .embedded-status-panel__facts > div {
        flex: 1 1 0;
        min-width: 0;
        padding: 14px;
        background: #f3f5f7;
        border: 1px solid #d7dee5;
      }

      .embedded-status-panel__facts > div + div {
        margin-left: 10px;
      }

      .embedded-status-panel__facts dt,
      .embedded-status-panel__facts dd {
        margin: 0;
        overflow-wrap: anywhere;
      }

      .embedded-status-panel__facts dt {
        color: #5d6a79;
        font-size: 12px;
        font-weight: 700;
      }

      .embedded-status-panel__facts dd {
        margin-top: 8px;
        color: #172033;
        font-size: 24px;
        font-weight: 800;
      }

      .embedded-status-panel__footer {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        min-width: 0;
        padding: 14px 20px 18px;
        border-top: 1px solid #e0e5ea;
      }

      .embedded-status-panel__footer > div {
        flex: 1 1 280px;
        min-width: 0;
        margin-right: 16px;
      }

      .embedded-status-panel__footer span,
      .embedded-status-panel__footer strong,
      .embedded-status-panel__footer p {
        display: block;
        margin: 0;
        overflow-wrap: anywhere;
      }

      .embedded-status-panel__footer span {
        color: #5d6a79;
        font-size: 12px;
        font-weight: 700;
      }

      .embedded-status-panel__footer strong {
        margin-top: 4px;
        font-size: 13px;
      }

      .embedded-status-panel__footer button {
        min-height: 42px;
        padding: 0 16px;
        border: 1px solid #1b6b86;
        border-radius: 6px;
        color: #ffffff;
        background: #1b6b86;
        cursor: pointer;
      }

      .embedded-status-panel__footer button:focus-visible {
        outline: 3px solid #f0b429;
        outline-offset: 3px;
      }

      .embedded-status-panel__footer p {
        flex: 0 0 100%;
        margin-top: 10px;
        color: #526174;
        font-size: 13px;
      }

      @media (max-width: 560px) {
        body {
          padding: 12px;
        }

        .embedded-status-panel__body {
          display: block;
        }

        .embedded-status-panel__summary {
          margin-right: 0;
        }

        .embedded-status-panel__facts {
          margin-top: 12px;
        }

        .embedded-status-panel__footer > div {
          flex-basis: 100%;
          margin-right: 0;
          margin-bottom: 12px;
        }
      }
    </style>
  </head>
  <body>
    <main class="host-shell">
      <p class="host-shell__label">宿主静态 HTML / React 尚未接管</p>
      <!-- prettier-ignore -->
      <div id="embedded-status-root"><article class="embedded-status-panel" data-status="healthy" data-testid="embedded-status-panel"><header class="embedded-status-panel__heading"><span>Embedded service status</span><strong>服务状态面板</strong></header><div class="embedded-status-panel__body"><section class="embedded-status-panel__summary" aria-label="当前服务状态"><span>当前状态</span><strong data-testid="panel-status-label">运行正常</strong><p data-testid="panel-status-message">三个核心服务均在目标范围内。</p></section><dl class="embedded-status-panel__facts"><div><dt>活动服务</dt><dd data-testid="panel-active-services">3</dd></div><div><dt>快照 revision</dt><dd data-testid="panel-snapshot-revision">0</dd></div></dl></div><footer class="embedded-status-panel__footer"><div><span>布局测量</span><strong data-testid="panel-measurement">等待首次提交后测量</strong></div><button type="button" data-testid="panel-primary-action">确认当前状态</button><p data-testid="panel-acknowledgement">确认次数：<!-- -->0</p></footer></article></div>
    </main>
  </body>
</html>
