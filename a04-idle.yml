          - list [ref=f39e700]:
            - listitem [ref=f39e701]: 路由集成把关键查询放到 Loader 里，渲染前写入缓存。
            - listitem [ref=f39e702]: Loader 和页面共用同一份 queryOptions，不要各写一套 queryKey。
            - listitem [ref=f39e703]: 关键数据要 await query，已经有缓存时用 staleTime static 不再挡住导航。
