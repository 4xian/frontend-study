            - paragraph [ref=f39e664]: "抽出 `taskDetailOptions`，`queryKey` 为 `['tasks', 'detail', 't-1']`。Loader 里 `await queryClient.query({ ...taskDetailOptions, staleTime: 'static' })`，不要 `catch`。详情页用 `useQuery(taskDetailOptions)` 读取同一条缓存。`queryFn` 调 `fetch`，非 2xx 时抛出带状态码的 `Error`。观察者 `staleTime` 为 `Infinity`，`retry` 为 `false`。"
            - generic [ref=f39e665]:
              - strong [ref=f39e666]: 验收标准
