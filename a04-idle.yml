            - text: 二、为什么要把查询放到路由 Loader
          - paragraph [ref=f39e97]:
            - text: 上一课已经能在点击时预取详情。那一次预取不挡住页面，失败也可以先吞掉，之后的
            - code [ref=f39e98]: useQuery
            - text: 再处理。
          - paragraph [ref=f39e99]: 进入详情路由时情况不同。详情是这个页面的关键数据：路由已经匹配，画面却还没有林晓的现有任务。如果等组件挂上再发请求，导航已经结束，用户会先看到等待。
          - paragraph [ref=f39e100]:
            - text: 把同一份查询放到 React Router 的 Loader 里，导航会等到
            - code [ref=f39e101]: query
            - text: 完成再渲染详情。列表仍只订阅
            - code [ref=f39e102]: "['tasks']"
            - text: 。详情的
            - code [ref=f39e103]: queryFn
            - text: 只在进入
            - code [ref=f39e104]: /tasks/t-1
            - text: 时运行。本课不把服务端渲染、TanStack Router 或 Suspense 查询写成主线。
